# The whole test suite, nightly and on demand (Actions → suite → Run workflow).
# Every spec but @web, which reads other live sites that often block cloud
# machines; those run locally. A red night can also mean the sandbox was reset
# (run dev/test/copy-to-sandbox.mjs) or runs a newer MusicBrainz.
name: suite
permissions:
  contents: write    # the badge's numbers go to the `badges` branch (#637)
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency: { group: sandbox, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: sudo apt-get install -y libarchive-tools   # bsdtar, for Art Station's zip spec
      - name: Sign in to the sandbox
        run: |
          node dev/test/login.mjs sandbox --auto
          node dev/test/login.mjs sandbox --auto --firefox   # Falcon's Firefox specs have their own profile (#637)
      - name: All specs but @web and @timing
        run: |
          set -o pipefail
          pnpm test --grep-invert "@web|@timing" 2>&1 | tee suite.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: suite-report
          path: test-results/html
          retention-days: 14
      # The README badge says how many passed and failed, not only "failing": a suite this
      # size on a shared sandbox has a spec or two red on most nights (#637). Shields reads
      # the numbers from badges/suite.json on the `badges` branch, rewritten each run.
      - name: Badge
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n() { grep -oE "^ +[0-9]+ $1" suite.log | tail -1 | grep -oE '[0-9]+' || true; }
          passed=$(n passed); failed=$(n failed); flaky=$(n flaky)
          msg="${passed:-0} passed"; color=brightgreen
          [ -n "$flaky" ] && msg="$msg, $flaky flaky" && color=yellowgreen
          [ -n "$failed" ] && msg="$msg, $failed failed" && color=orange
          [ -n "$failed" ] && [ "$failed" -gt 5 ] && color=red
          mkdir badge && cd badge && git init -q -b badges
          printf '{"schemaVersion":1,"label":"suite","message":"%s","color":"%s"}\n' "$msg" "$color" > suite.json
          git add suite.json && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "suite: $msg"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" badges
