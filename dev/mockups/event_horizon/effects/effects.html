<div id="eh-effects-sampler">
  <div class="sample-bar"><label>Appearance <select data-theme><option value="dark">Dark</option><option value="light">Light</option></select></label><label>Content <select data-content><option value="show">Show page</option><option value="hide">Effects only</option></select></label><button type="button" data-pause aria-pressed="false">Pause</button></div>
  <div class="sample-grid"></div>
</div>
<style>
#eh-effects-sampler{font:13px/1.45 system-ui,sans-serif;--eh-s-bg:#101319;--eh-s-surface:#191d26;--eh-s-text:#e2e7f0;--eh-s-muted:#9ca9bb;--eh-s-border:#343c4c;--eh-s-c1:#79c8f4;--eh-s-c2:#bb97f3;color:var(--eh-s-text)}
#eh-effects-sampler.light{--eh-s-bg:#f4f6fa;--eh-s-surface:#fff;--eh-s-text:#243044;--eh-s-muted:#52627a;--eh-s-border:#c9d0dd;--eh-s-c1:#2779af;--eh-s-c2:#8251b3}
#eh-effects-sampler *{box-sizing:border-box}
#eh-effects-sampler .sample-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 14px;color:inherit}
#eh-effects-sampler .sample-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
#eh-effects-sampler section{min-width:0;background:var(--eh-s-bg);padding:12px}
#eh-effects-sampler h3{font-size:16px;font-weight:500;line-height:1.4;margin:0}
#eh-effects-sampler .desc{font-size:12px;color:var(--eh-s-muted);min-height:36px;margin:3px 0 10px}
#eh-effects-sampler .stage{position:relative;height:230px;overflow:hidden}
#eh-effects-sampler canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#eh-effects-sampler .page{position:relative;margin:18px 14px;pointer-events:none}
#eh-effects-sampler .page header{font-size:11px;letter-spacing:1.4px;color:var(--eh-s-muted)}
#eh-effects-sampler .page strong{display:block;font-size:22px;font-weight:500;margin:10px 0 0}
#eh-effects-sampler .page small{color:var(--eh-s-muted)}
#eh-effects-sampler .tracks{margin-top:18px;background:color-mix(in srgb,var(--eh-s-surface) 62%,transparent)}
#eh-effects-sampler .track{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid color-mix(in srgb,var(--eh-s-border) 55%,transparent);font-size:11px}
#eh-effects-sampler .params{display:grid;gap:6px;margin-top:12px}
#eh-effects-sampler label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;min-width:0}
#eh-effects-sampler select,#eh-effects-sampler button{background:var(--eh-s-surface);color:var(--eh-s-text);border:1px solid var(--eh-s-border);border-radius:3px;font:inherit;padding:4px 6px;max-width:100%}
#eh-effects-sampler .sample-bar{padding:8px;background:var(--eh-s-bg)}
#eh-effects-sampler.hide-content .page{visibility:hidden}
@media(max-width:800px){#eh-effects-sampler .sample-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){#eh-effects-sampler .sample-grid{grid-template-columns:minmax(0,1fr)}}
@media(pointer:coarse){#eh-effects-sampler select,#eh-effects-sampler button{min-height:44px;font-size:16px}}
</style>
<script>
(() => {
// Independent background geometries. The preview and userscript use this same renderer.
// A rider chooses a new route at each junction. Trails are bounded by distance, not frame count.
function tronCreate(w, h, p, random = Math.random) {
    const grid = p.tronGrid;
    const state = { grid, maxX: Math.max(grid, Math.floor(w / grid) * grid), maxY: Math.max(grid, Math.floor(h / grid) * grid), random, time: 0, effects: [], riders: [], dirs: [[1, 0], [0, 1], [-1, 0], [0, -1]] };
    for (let i = 0; i < p.tronRiders; i++) {
        const r = { id: i, alive: false, trail: [], distance: 0, remaining: 0, respawn: 0, died: -1 };
        state.riders.push(r); tronSpawn(state, r);
    }
    return state;
}
function tronSpawn(state, r) {
    for (let attempt = 0; attempt < 40; attempt++) {
        const x = Math.floor(state.random() * (state.maxX / state.grid + 1)) * state.grid;
        const y = Math.floor(state.random() * (state.maxY / state.grid + 1)) * state.grid;
        const occupied = state.riders.some(other => other !== r && ((other.alive && Math.hypot(other.x - x, other.y - y) < state.grid * .5)
            || other.trail.some(edge => tronHit(x, y, x, y, edge) === 0)));
        if (occupied) continue;
        Object.assign(r, { x, y, dir: Math.floor(state.random() * 4), alive: true, trail: [], distance: 0, remaining: 0, died: -1 });
        return true;
    }
    r.alive = false; r.respawn = state.time + .3;
    return false;
}
// Distance to the first crossing, including collinear trails and endpoints; Infinity means no hit.
function tronHit(x, y, nx, ny, edge) {
    const [ax, ay] = edge.a, [bx, by] = edge.b, eps = 1e-6;
    const within = (v, a, b) => v >= Math.min(a, b) - eps && v <= Math.max(a, b) + eps;
    if (Math.abs(y - ny) < eps) {
        if (Math.abs(ax - bx) < eps) return within(ax, x, nx) && within(y, ay, by) ? Math.abs(ax - x) : Infinity;
        if (Math.abs(y - ay) > eps) return Infinity;
        const lo = Math.max(Math.min(x, nx), Math.min(ax, bx)), hi = Math.min(Math.max(x, nx), Math.max(ax, bx));
        return lo <= hi + eps ? Math.abs((nx >= x ? lo : hi) - x) : Infinity;
    }
    if (Math.abs(ay - by) < eps) return within(ay, y, ny) && within(x, ax, bx) ? Math.abs(ay - y) : Infinity;
    if (Math.abs(x - ax) > eps) return Infinity;
    const lo = Math.max(Math.min(y, ny), Math.min(ay, by)), hi = Math.min(Math.max(y, ny), Math.max(ay, by));
    return lo <= hi + eps ? Math.abs((ny >= y ? lo : hi) - y) : Infinity;
}
function tronStep(state, dt, p) {
    dt = Math.max(0, Math.min(.1, dt)); state.time += dt;
    state.effects = state.effects.filter(e => state.time - e.born < .6);
    // Dead trails fade before a replacement can spawn, and cannot remain invisible collision hazards.
    for (const r of state.riders) if (!r.alive && state.time - r.died >= .65) r.trail = [];
    for (const r of state.riders) {
        if (!r.alive) { if (state.time >= r.respawn) tronSpawn(state, r); continue; }
        let travel = dt * p.tronSpeed * 35;
        while (travel > 1e-6 && r.alive) {
            if (r.remaining < 1e-6) {
                r.x = Math.round(r.x / state.grid) * state.grid; r.y = Math.round(r.y / state.grid) * state.grid;
                const choices = [r.dir, (r.dir + 1) % 4, (r.dir + 3) % 4].filter(d => {
                    const [dx, dy] = state.dirs[d], x = r.x + dx * state.grid, y = r.y + dy * state.grid;
                    return x >= 0 && y >= 0 && x <= state.maxX && y <= state.maxY;
                });
                // The only exit at a corner can be behind the rider.
                if (!choices.length) choices.push((r.dir + 2) % 4);
                r.dir = choices[Math.floor(state.random() * choices.length)]; r.remaining = state.grid;
            }
            const [dx, dy] = state.dirs[r.dir], planned = Math.min(travel, r.remaining);
            let distance = planned, hit = false;
            for (const other of state.riders) {
                if (other === r) continue;
                for (const edge of other.trail) {
                    const d = tronHit(r.x, r.y, r.x + dx * planned, r.y + dy * planned, edge);
                    if (d <= distance) { distance = d; hit = true; }
                }
            }
            const a = [r.x, r.y], start = r.distance;
            r.x += dx * distance; r.y += dy * distance; r.distance += distance;
            const last = r.trail[r.trail.length - 1];
            if (distance > 1e-6) {
                if (last && last.dir === r.dir) { last.b = [r.x, r.y]; last.end = r.distance; }
                else r.trail.push({ a, b: [r.x, r.y], start, end: r.distance, dir: r.dir });
            }
            r.remaining -= distance; travel -= distance;
            const cut = r.distance - state.grid * p.tronTrail;
            while (r.trail.length && r.trail[0].end <= cut) r.trail.shift();
            const tail = r.trail[0];
            if (tail && tail.start < cut) {
                const f = (cut - tail.start) / (tail.end - tail.start);
                tail.a = [tail.a[0] + (tail.b[0] - tail.a[0]) * f, tail.a[1] + (tail.b[1] - tail.a[1]) * f]; tail.start = cut;
            }
            if (hit) {
                r.alive = false; r.died = state.time; r.respawn = state.time + .9 + state.random() * 1.2;
                state.effects.push({ x: r.x, y: r.y, id: r.id, born: state.time });
            }
        }
    }
}

function ambientDraw(ctx, w, h, kind, p, t, c1, c2) {

                    const point = f => [edge.a[0] + (edge.b[0] - edge.a[0]) * f, edge.a[1] + (edge.b[1] - edge.a[1]) * f];

        }

        // Cap ray count rather than blurring a full-screen canvas every frame.
        const pace = t * p.auroraSpeed * .12, step = Math.max(2.5, w / 260);
        for (let band = 0; band < p.auroraRibbons; band++) {

            for (let x = 0; x <= w; x += step) {

                const hem = h * (.47 + band * .15) + h * .065 * Math.sin(u * 4.5 + band * 2 + pace * .3)
                    + h * .035 * Math.sin(fold + pace * .2);

                const top = hem - height * (.85 + .15 * Math.sin(u * 17 + band + pace * .4));

                line([[x, hem - 2], [x, hem + 1]], col, edge * (.2 + .4 * pleat) * shimmer, step * .8);

        for (let i = 0; i < p.orbitRings; i++) {

            ctx.ellipse(0, 0, radius * 1.8, radius * .65, 0, 0, tau); stroke(col, .18, .8);

                ctx.globalAlpha = .65; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, radius * 1.8, radius * .65, 0, angle - .22, angle); stroke(col, .65, 2);

            }
        }
        ctx.restore();
    }
    ctx.globalAlpha = 1;
}

const AMBIENT = {
    tron: { name: 'Tron', tip: 'Light riders turn through a square circuit grid', rows: [
        ['tronOutlines', 'Outlines', [0, 10, 25, 50, 100], 25], ['tronGrid', 'Grid size', [24, 40, 64], 40], ['tronRiders', 'Riders', [8, 16, 28], 16], ['tronSpeed', 'Speed', [.4, 1, 2], 1], ['tronTrail', 'Trail length', [1, 3, 6], 3],
    ] },
    stars: { name: 'Stars', tip: 'Layers of drifting stars with a quiet twinkle', rows: [
        ['starDensity', 'Density', [.4, 1, 2], 1], ['starDrift', 'Drift', [0, .4, 1], .4], ['starDepth', 'Depth', [.5, 1, 2], 1], ['starTwinkle', 'Twinkle', [0, .5, 1], .5],
    ] },
    aurora: { name: 'Aurora', tip: 'Polar-light curtains with fine vertical rays and a luminous lower edge', rows: [
        ['auroraRibbons', 'Ribbons', [1, 2, 3], 2], ['auroraSpeed', 'Speed', [.4, 1, 2], .4], ['auroraHeight', 'Height', [.1, .25, .4], .25], ['auroraFolds', 'Folds', [5, 10, 18], 10],
    ] },
    orbit: { name: 'Orbit', tip: 'Tilted orbital rings carry small satellites', rows: [
        ['orbitRings', 'Rings', [3, 5, 8], 5], ['orbitMoons', 'Satellites', [1, 2, 3], 1], ['orbitTilt', 'Tilt', [-35, -15, 15], -15], ['orbitSpeed', 'Speed', [.4, 1, 2], .4],
    ] },
};
const AMBIENT_DEFAULTS = Object.fromEntries(Object.values(AMBIENT).flatMap(f => f.rows.map(([k, , , v]) => [k, v])));
const AMBIENT_KEYS = ['effect', 'ambientOpacity', ...Object.keys(AMBIENT_DEFAULTS)];

function ambientApply(layer, kind) {
    layer._ehDepthOff?.(); layer.querySelector('svg').style.display = 'none';
    layer.style.setProperty('--eh-hex-mf', '1'); layer.style.setProperty('--eh-hex-fx', Math.max(0, Math.min(100, Number(S.ambientOpacity) || 0)) / 100);

const root = document.getElementById('eh-effects-sampler');
const saved = window.openai?.widgetState?.privateContent || {};
const reduce = matchMedia('(prefers-reduced-motion:reduce)');
let paused = typeof saved.paused === 'boolean' ? saved.paused : reduce.matches, explicitPlay = false, t = 12, last = 0, raf = 0;
const specs = [['hexagons',{name:'Hexagons · current',tip:'Existing lattice with the Drift motion',rows:[['hexOpacity','Outlines',[20,40,60],40],['hexSpeed','Pace',[.6,1,1.6],.6],['hexStrength','Effect',[25,65,100],65]]}],...Object.entries(AMBIENT)];
const items = [];
for(const [key,f] of specs) {

}
function draw(){

    for(let y=-48;y<h+48;y+=48)for(let x=-28;x<w+28;x+=28){

      ctx.globalAlpha=p.hexOpacity/200+wave*p.hexStrength/100;ctx.beginPath();ctx.moveTo(x+14,y);ctx.lineTo(x+28,y+8);ctx.lineTo(x+28,y+24);ctx.lineTo(x+14,y+32);ctx.lineTo(x,y+24);ctx.lineTo(x,y+8);ctx.closePath();ctx.moveTo(x+14,y+32);ctx.lineTo(x+14,y+48);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}
function persist(){window.openai?.setWidgetState?.({modelContent:{effects:Object.fromEntries(items.map(i=>[i.key,i.p]))},privateContent:{params:Object.fromEntries(items.map(i=>[i.key,i.p])),paused,theme:root.querySelector('[data-theme]').value,content:root.querySelector('[data-content]').value}})?.catch(()=>{});}
const theme=root.querySelector('[data-theme]'),content=root.querySelector('[data-content]'),pause=root.querySelector('[data-pause]');

theme.onchange=()=>{appearance();persist();};content.onchange=()=>{appearance();persist();};
function syncPause(){pause.textContent=paused?'Play':'Pause';pause.setAttribute('aria-pressed',String(paused));}
pause.onclick=()=>{paused=!paused;explicitPlay=!paused;syncPause();schedule();persist();};
function frame(now){raf=0;if(last)t+=Math.min(.1,(now-last)/1000);last=now;draw();if(!paused&&(!reduce.matches||explicitPlay)&&!document.hidden)raf=requestAnimationFrame(frame);}

document.addEventListener('visibilitychange',schedule);reduce.addEventListener('change',()=>{explicitPlay=false;if(reduce.matches)paused=true;syncPause();schedule();});
new ResizeObserver(draw).observe(root);appearance();syncPause();schedule();
})();
