# docker compose run --rm metrics            full run against the latest dump
# docker compose run --rm metrics --report-only
#
# The dump cache is a named volume, not a bind mount: it holds ~15 GB and lives
# inside the Docker VM, where reads are far faster than across the Windows
# filesystem boundary. Only the small outputs cross back to the host.
services:
  metrics:
    build: .
    image: mb-script-metrics
    volumes:
      - dumpcache:/data
      - ./out:/out
      # The GitHub Pages site serves the dashboard as docs/stats.html, so the
      # report step writes it directly instead of anyone copying it by hand and
      # forgetting the next time. Nothing else in the repo is exposed.
      - ../../docs:/site
    environment:
      SITE_DIR: /site

volumes:
  dumpcache:
