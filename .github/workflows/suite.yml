# The whole test suite, nightly and on demand (Actions → suite → Run workflow).
# Every spec but @web, which reads other live sites that often block cloud
# machines; those run locally. A red night can also mean the sandbox was reset
# (run dev/test/copy-to-sandbox.mjs) or runs a newer MusicBrainz.
name: suite
permissions:
  contents: write    # the badge's numbers go to the `badges` branch (#637)
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency: { group: sandbox, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: sudo apt-get install -y libarchive-tools   # bsdtar, for Art Station's zip spec
      - name: Sign in to the sandbox
        run: |
          node dev/test/login.mjs sandbox --auto
          node dev/test/login.mjs sandbox --auto --firefox   # Falcon's Firefox specs have their own profile (#637)
      - name: All specs but @web and @timing
        run: |
          set -o pipefail
          PW_JSON="$RUNNER_TEMP/results.json" pnpm test --grep-invert "@web|@timing" 2>&1 | tee suite.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: suite-report
          path: test-results/html
          retention-days: 14
      # The README badge says how many passed and failed, not only "failing": a suite this
      # size on a shared sandbox has a spec or two red on most nights (#637). Shields reads
      # the numbers from suite.json on the `badges` branch. history.json beside it keeps every
      # run, newest first: counts, each failure with its error, the flaky specs (#647);
      # node dev/test/flaky-report.mjs lists what keeps failing.
      - name: Badge and history
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir badge
          git fetch -q --depth=1 origin badges && git show FETCH_HEAD:history.json > badge/history.json 2>/dev/null || echo '{}' > badge/history.json
          node dev/test/suite-history.mjs "$RUNNER_TEMP/results.json" badge/history.json --badge badge/suite.json --commit "$GITHUB_SHA" --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cd badge && git init -q -b badges
          git add suite.json history.json
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "suite: $(node -p "require('./suite.json').message")"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" badges
