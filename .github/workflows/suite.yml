# The test suite on test.musicbrainz.org, spread over 3 runners with PW_WORKERS workers each.
#
#   nightly     every night but Sunday: the specs that guard behaviour. Not @unit (checks runs
#               them on every push), @cosmetic, @fixture or @debug (the weekly run has them),
#               @env or @quarantine.
#   full        Sunday night: every spec but @web, @timing, @unit, @env and @quarantine.
#   env         by hand: the @env specs, which fail when the sandbox, its search index or
#               another service misbehaves. Run them before a release or after a change there.
#   quarantine  by hand: the @quarantine specs, red every night until fixed or deleted.
#
# @web reads other live sites, which often block cloud machines; those run locally. A red
# night can also mean the sandbox was reset (run dev/test/copy-to-sandbox.mjs) or runs a newer
# MusicBrainz. dev/test/README.md → CI says more.
name: suite
permissions:
  contents: write    # the badge's numbers go to the `test-history` branch (#637)
on:
  schedule:
    - cron: '0 2 * * 1-6'   # nightly
    - cron: '0 2 * * 0'     # full, on Sunday
  workflow_dispatch:
    inputs:
      set:
        description: Which specs
        type: choice
        options: [nightly, full, env, quarantine]
        default: nightly
      workers:
        description: Workers on each runner (fewer if the sandbox throttles them; flaky-report.mjs --causes)
        type: choice
        options: ['3', '2', '1']
        default: '3'
# one run on the sandbox at a time, this or checks' @critical job: they would share its throttling
concurrency: { group: sandbox, cancel-in-progress: false }
env:
  SET: ${{ inputs.set || (github.event.schedule == '0 2 * * 0' && 'full') || 'nightly' }}
  PW_WORKERS: ${{ inputs.workers || '3' }}
  RUNNERS: 3
jobs:
  # the sandbox answers, or nothing runs (dev/test/preflight.mjs)
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dev/test/preflight.mjs

  suite:
    needs: preflight
    runs-on: ubuntu-24.04   # Playwright has no browsers for 26.04 (ubuntu-latest since 2026-11)
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]   # keep in step with RUNNERS
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: sudo apt-get install -y libarchive-tools   # bsdtar, for Art Station's zip spec
      - name: Sign in to the sandbox, one profile per worker
        run: |
          node dev/test/login.mjs sandbox --auto
          node dev/test/login.mjs sandbox --auto --firefox   # Falcon's Firefox specs have their own profile (#637)
          node dev/test/worker-profiles.mjs "$PW_WORKERS"
      - name: The ${{ env.SET }} specs of this runner's scripts
        env:
          PW_BLOB: runner-${{ matrix.runner }}
        run: |
          set -o pipefail
          case "$SET" in
            nightly)    pick=(--grep-invert "@web|@timing|@unit|@env|@quarantine|@cosmetic|@fixture|@debug") ;;
            full)       pick=(--grep-invert "@web|@timing|@unit|@env|@quarantine") ;;
            env)        pick=(--grep @env --grep-invert "@web|@timing") ;;
            quarantine) pick=(--grep @quarantine --grep-invert "@web|@timing") ;;
          esac
          # shorter limits and the early stop, but not for the @env specs, which are slow and
          # expected to meet the environment's failures
          if [ "$SET" = nightly ] || [ "$SET" = full ]; then export PW_FAST=1 PW_ENV_STOP=5; fi
          pnpm test $(node dev/test/shards.mjs "$RUNNERS" ${{ matrix.runner }}) "${pick[@]}" --pass-with-no-tests 2>&1 | tee suite.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.runner }}
          path: blob-report
          retention-days: 3

  # one report from the three runners: the HTML report, and the badge and history
  report:
    needs: suite
    if: ${{ !cancelled() && needs.suite.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob
          merge-multiple: true
      - name: Merge the runners' reports
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/results.json" pnpm exec playwright merge-reports --reporter json all-blob
          PLAYWRIGHT_HTML_OUTPUT_DIR=test-results/html pnpm exec playwright merge-reports --reporter html all-blob
      - uses: actions/upload-artifact@v4
        with:
          name: suite-report
          path: test-results/html
          retention-days: 14
      # The README badge says how many passed and failed, not only "failing" (#637). Shields
      # reads the numbers from suite.json on the `test-history` branch. history.json beside it
      # keeps every run, newest first: counts, how long it took, how it was spread, each failure
      # with its error and cause (#647); node dev/test/flaky-report.mjs lists what keeps failing,
      # and --causes how often the sandbox throttled each layout. Only the nightly and full
      # runs go in: the @env and @quarantine runs are expected to be red.
      - name: Badge and history
        if: ${{ github.ref == 'refs/heads/main' && (env.SET == 'nightly' || env.SET == 'full') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir badge
          git fetch -q --depth=1 origin test-history && git show FETCH_HEAD:history.json > badge/history.json 2>/dev/null || echo '{}' > badge/history.json
          node dev/test/suite-history.mjs "$RUNNER_TEMP/results.json" badge/history.json --badge badge/suite.json --commit "$GITHUB_SHA" --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --source "$([ "$SET" = full ] && echo weekly || echo nightly)" --layout "${RUNNERS}x${PW_WORKERS}"
          cd badge && git init -q -b test-history
          git add suite.json history.json
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "suite: $(node -p "require('./suite.json').message")"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" test-history
