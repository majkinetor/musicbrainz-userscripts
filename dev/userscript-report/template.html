<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MusicBrainz userscript review</title><style>@@CSS@@</style></head><body><main>
<header><div class="eyebrow">MusicBrainz toolset / Review</div><h1>Which scripts can the suite replace?</h1><p class="dim">@@COUNT@@ tools · @@REVIEWED@@ source-reviewed <button class="help" data-tip="Report coverage\nOther external scripts are unassessed. Wiki descriptions are not replacement findings." aria-label="About report coverage">?</button></p></header>
<section class="review-toolbar" aria-label="Review files"><div><button id="github" type="button" data-tip="Request changes on GitHub\nPrepare a concise change list and review export for the 3rd party discussion category">Send to GitHub</button><button id="export" type="button" data-tip="Download your review\nIncludes comments, verdicts, weights and source references">Export</button><button id="import" type="button" data-tip="Restore a review file\nNewer edits win. Deleted comments stay deleted.">Import</button><input id="import-file" type="file" accept="application/json,.json" hidden></div><span id="save-status" role="status" aria-live="polite">No reviews</span></section>
<section class="filters" aria-label="Filter scripts"><label>Search<input id="search" type="search" placeholder="Scripts, features, comments"></label><label>Report verdict<select id="verdict"><option value="">All verdicts</option>@@VERDICTS@@</select></label><label>Category<select id="category"><option value="">All categories</option>@@CATEGORIES@@</select></label><label>Suite tool<select id="tool"><option value="">All tools</option>@@TOOLS@@</select></label><label>Review<select id="review-filter"><option value="">All entries</option><option>Not reviewed</option><option>In progress</option><option>Confirmed</option><option>Changes requested</option><option>Edited</option><option>Needs recheck</option></select></label><button id="reset" type="button">Reset</button><button id="collapse" type="button">Collapse all</button></section>
<p id="count" class="count" role="status" aria-live="polite">@@COUNT@@ entries</p><p id="message" role="status" aria-live="polite"></p><p id="orphans" class="dim" hidden></p>
<div class="list-heading"><span>Script</span><span>Verdict</span></div><section id="scripts" aria-label="Listed scripts">@@ROWS@@</section><p id="empty" hidden>No matching scripts.</p>
<footer><p id="provenance"></p><p>Your drafts stay in this browser until you share them.</p><a href="https://github.com/majkinetor/musicbrainz-userscripts/issues/926" target="_blank" rel="noopener noreferrer">Project issue ↗</a></footer>
<dialog id="share-dialog" aria-labelledby="share-title"><form method="dialog" class="dialog-header"><h2 id="share-title">Request changes</h2><button aria-label="Close" class="plain">✕</button></form><p id="share-version" class="dim"></p><div id="share-summary"></div><label>Discussion draft <button class="help" type="button" data-tip="Publish from your GitHub account\nCopy this draft into the 3rd party discussion and publish. The report reference and export are included." aria-label="About GitHub publishing">?</button><textarea id="share-body" readonly aria-label="Discussion Markdown"></textarea></label><p id="share-hint"></p><div class="share-actions"><button id="share-copy" type="button">Copy draft</button><a id="share-open" class="button" target="_blank" rel="noopener noreferrer">Open GitHub</a><button id="share-export" type="button">Download JSON</button></div></dialog>
</main><script type="application/json" id="report-data">@@DATA@@</script><script>@@MODEL@@
@@SHARING@@
@@TOOLTIPS@@
@@UI@@</script></body></html>
