<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- a small relationship graph: three entities joined by edges -->
  <g fill="none" stroke="#5b6b7a" stroke-width="7" stroke-linecap="round">
    <line x1="34" y1="42" x2="94" y2="42"/>
    <line x1="34" y1="42" x2="64" y2="94"/>
    <line x1="94" y1="42" x2="64" y2="94"/>
  </g>
  <g fill="#2e9e5b" stroke="#256f43" stroke-width="4">
    <circle cx="34" cy="42" r="16"/>
    <circle cx="94" cy="42" r="16"/>
    <circle cx="64" cy="94" r="16"/>
  </g>
</svg>
