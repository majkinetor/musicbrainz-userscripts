# What the pre-commit hook builds, built on main too (#646): Credit Hoarder's dist/, the
# String Theory bundle and its DOCS.md, and the shared blocks inlined into the scripts. A
# commit made without the hook (the web editor, another machine, --no-verify, a merge)
# would otherwise leave them behind their sources. dev/regen.mjs rebuilds everything and
# keeps only real changes, so where the hook ran nothing is committed.
name: build
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: build-main, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir userscripts/credit_hoarder install --frozen-lockfile
      - name: Regenerate
        run: node dev/regen.mjs
      - name: Commit what changed
        run: |
          if git diff --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u userscripts
          git commit --no-verify -m "build: regenerated from their sources [skip ci]" -m "$(git diff --cached --name-only)"
          # main may have moved on while this ran: replay on top of it once
          git push || { git pull --rebase && git push; }
