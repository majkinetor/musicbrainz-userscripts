<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's new — String Theory</title>
<meta name="description" content="Announcements for String Theory and the scripts it bundles.">
<!-- The Announcements discussions, from news.json beside this page (#1123). The pages workflow rebuilds
     that file from GitHub on every change to an announcement; dev/news/README.md says how. -->
<style>
  :root{ --bg:#ffffff; --ink:#141618; --dim:#5f6469; --faint:#9ba1a6; --rule:#ececef; --soft:#f5f6f7; --accent:#1f6feb; }
  @media (prefers-color-scheme: dark){ :root:not([data-t=light]){
    --bg:#0d0f11; --ink:#e8eaec; --dim:#98a0a6; --faint:#666d73; --rule:#1b1f23; --soft:#15181b; --accent:#6ea8ff; } }
  :root[data-t=dark]{ --bg:#0d0f11; --ink:#e8eaec; --dim:#98a0a6; --faint:#666d73; --rule:#1b1f23; --soft:#15181b; --accent:#6ea8ff; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15.5px/1.68 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  .w{max-width:760px;margin:0 auto;padding:0 26px}
  nav{display:flex;gap:22px;padding:22px 0 0;font-size:14.5px}
  nav a{color:var(--dim);text-decoration:none}nav a:hover{color:var(--accent)}
  h1{margin:36px 0 4px;font-size:34px;line-height:1.2;letter-spacing:-.02em}
  .lede{margin:0;color:var(--dim);font-size:14.5px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:22px 0 8px}
  .bar button{min-height:30px;padding:0 12px;border:1px solid var(--rule);border-radius:15px;background:none;color:var(--dim);font:inherit;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .bar button:hover{color:var(--ink);background:var(--soft)}
  .bar button[aria-pressed=true]{color:var(--ink);border-color:var(--accent)}
  .bar img{width:16px;height:16px;object-fit:contain}
  .bar .gal{margin-left:auto}
  article{padding:26px 0;border-top:1px solid var(--rule)}
  article:first-of-type{border-top:0}
  article h2{display:flex;align-items:center;gap:10px;margin:0;font-size:20px;line-height:1.35;letter-spacing:-.01em}
  article h2 img{width:24px;height:24px;flex:0 0 auto;object-fit:contain}
  article h2 a{color:inherit;text-decoration:none}article h2 a:hover{color:var(--accent)}
  .m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:4px 0 12px;color:var(--dim);font-size:13.5px}
  .m .c{padding:0 7px;border:1px solid var(--rule);border-radius:10px;font-size:12.5px}
  .m a{color:var(--dim)}.m a:hover{color:var(--accent)}
  .b{overflow-wrap:anywhere}
  .b>:first-child{margin-top:0}.b>:last-child{margin-bottom:0}
  .b img{max-width:100%;height:auto}
  .b h1,.b h2,.b h3{font-size:16px;margin:18px 0 6px}
  .b code{padding:1px 5px;border-radius:4px;background:var(--soft);font-size:.9em}
  .b pre{overflow:auto;padding:10px 12px;border-radius:6px;background:var(--soft);scrollbar-width:thin;scrollbar-color:var(--rule) transparent}.b pre code{padding:0;background:none}
  .b blockquote{margin:10px 0;padding:0 14px;border-left:3px solid var(--rule);color:var(--dim)}
  .b table{border-collapse:collapse;display:block;overflow:auto}.b th,.b td{padding:4px 10px;border:1px solid var(--rule)}
  .b abbr{text-decoration:underline dotted;text-underline-offset:2px;cursor:help}
  .b .anchor,.b .octicon{display:none}
  .state{padding:30px 0;color:var(--dim)}
  /* the full view of a post's images, as Art Station's: dark in both themes */
  .b img:not(.emoji){cursor:zoom-in}
  #lb{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;background:rgba(15,12,28,.92);color:#eee;user-select:none;touch-action:none}
  #lb[hidden]{display:none}
  #lb img{max-width:92vw;max-height:84vh;object-fit:contain;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.6);background:#fff;transition:opacity .15s;cursor:default}
  #lb img.z{cursor:grab}#lb img.loading{opacity:.35}
  #lb button{position:fixed;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:none;color:#fff;font:inherit;cursor:pointer}
  #lb button:hover{background:rgba(255,255,255,.25)}
  #lb .x{top:16px;right:20px;width:42px;height:42px;border-radius:8px;font-size:24px}
  #lb .nav{top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;font-size:42px;line-height:1;z-index:2}
  #lb .prev{left:18px}#lb .next{right:18px}#lb .nav[hidden]{display:none}
  #lb .cap{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;max-width:84vw;font-size:13px;text-align:center}
  #lb .cap a{color:#cfc6f5}
  body.lb{overflow:hidden}
  @media (pointer:coarse){ #lb{padding:0} #lb img{max-width:100vw;max-height:100vh;border-radius:0;box-shadow:none} #lb .nav{display:none} #lb .cap{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));padding:4px 12px;border-radius:12px;background:rgba(15,12,28,.7)} }
  /* the contents: every post shown, by title; beside the posts on a wide screen, folded above them on a narrow one */
  #toc{margin:6px 0 4px;font-size:13.5px}
  #toc summary{display:inline-flex;align-items:center;min-height:30px;color:var(--dim);cursor:pointer;user-select:none}
  #toc summary:hover{color:var(--ink)}
  #toc summary::-webkit-details-marker{display:none}
  #toc summary::before{content:'\25B8';width:14px;font-size:12px}#toc[open] summary::before{content:'\25BE'}
  #toc ol{list-style:none;margin:6px 0 10px;padding:0;border-left:1px solid var(--rule)}
  #toc li[hidden]{display:none}
  #toc a{display:flex;align-items:baseline;gap:8px;padding:3px 0 3px 12px;margin-left:-1px;border-left:2px solid transparent;color:var(--dim);text-decoration:none;line-height:1.4}
  #toc a:hover{color:var(--ink)}
  #toc a.on{color:var(--ink);border-left-color:var(--accent)}
  #toc a img{width:14px;height:14px;flex:0 0 auto;object-fit:contain;align-self:center}
  #toc a span{flex:1 1 auto;min-width:0}
  #toc time{flex:0 0 auto;color:var(--faint);font-size:12px}
  @media (min-width:1260px){
    #toc{position:fixed;top:24px;left:calc(50% + 400px);width:min(290px,calc(50% - 420px));max-height:calc(100vh - 48px);margin:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
    #toc summary{min-height:0;margin-bottom:2px;pointer-events:none;list-style:none;color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
    #toc summary::before{content:none}
    #toc ol{margin:4px 0 0}
  }
  footer{display:flex;flex-wrap:wrap;gap:22px;margin:40px 0 0;padding:18px 0 40px;border-top:1px solid var(--rule);color:var(--faint);font-size:13.5px}
  footer a{color:var(--dim)}
  @media(max-width:620px){ .w{padding:0 16px} h1{font-size:28px} article h2{font-size:18px} }
</style>
</head>
<body>
<div class="w">
  <nav><a href="./">String Theory</a><a href="https://github.com/majkinetor/musicbrainz-userscripts/discussions/categories/announcements">Discussions</a><a href="https://github.com/majkinetor/musicbrainz-userscripts/blob/main/userscripts/string_theory/CHANGELOG.md">Changelog</a></nav>
  <h1>What's new</h1>
  <p class="lede" id="lede">Announcements for String Theory and the scripts it bundles.</p>
  <div class="bar" id="bar" hidden></div>
  <details id="toc" hidden><summary>Contents</summary><ol></ol></details>
  <main id="list"><p class="state">Loading…</p></main>
  <footer><span>MIT</span><a href="./privacy.html">Privacy</a><a href="./terms.html">Terms</a></footer>
</div>
<script>
// short names in a post get a dotted underline and the full name as a tip, as in String Theory's viewer
const ABBR = { AS: 'Art Station', BP: 'Bandcamp Player Enhanced', CH: 'Credit Hoarder', DC: 'Discogs Credits', EH: 'Event Horizon',
  FC: 'First Contact', GT: 'Group Therapy', IS: 'ISRC Scout', MB: 'MusicBrainz', MC: 'Mission Control', MM: 'Mammoth', PC: 'Platform Check',
  RG: 'Release group', ST: 'String Theory' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day = at => new Date(at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
// GitHub's rendered body, without what can run, and without the `Issue: #N` line (the header links the issue)
function clean(html) {
  const d = new DOMParser().parseFromString(html, 'text/html');
  d.querySelectorAll('script,style,iframe,object,embed,form').forEach(e => e.remove());
  d.querySelectorAll('*').forEach(e => {
    [...e.attributes].forEach(a => { if (/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) e.removeAttribute(a.name); });
    if (e.tagName === 'A' && !/^#/.test(e.getAttribute('href') || '')) e.rel = 'noopener';
  });
  d.querySelectorAll('sub').forEach(e => { if (/^\s*Issue:/i.test(e.textContent)) e.remove(); });
  const w = d.createTreeWalker(d.body, 4), nodes = [], re = /\b(?:AS|BP|CH|DC|EH|FC|GT|IS|MB|MC|MM|PC|RG|ST)\b/g;
  for (let n; (n = w.nextNode());) if (!n.parentNode.closest('a,code,pre')) nodes.push(n);
  nodes.forEach(t => {
    const txt = t.nodeValue, frag = d.createDocumentFragment(); let last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(txt))) {
      frag.append(txt.slice(last, m.index));
      const a = d.createElement('abbr'); a.textContent = m[0]; a.title = ABBR[m[0]]; frag.append(a);
      last = m.index + m[0].length;
    }
    if (!last) return;
    frag.append(txt.slice(last)); t.replaceWith(frag);
  });
  return d.body.innerHTML;
}
const icon = i => i.icon ? `<img src="${esc(i.icon)}" alt="">` : '';
const REPO = 'https://github.com/majkinetor/musicbrainz-userscripts';
function post(i) {
  // the title links to the post's own page (news/<id>), whose link preview shows this post; on the list a click stays there
  return `<article id="${i.id}" data-script="${esc(i.script)}"><h2>${icon(i)}<a href="./news/${i.id}" data-id="${i.id}" title="Link to this post">${esc(i.title)}</a></h2>`
    + `<div class="m"><span>${esc(i.script)}</span><time datetime="${esc(i.at)}">${esc(day(i.at))}</time>`
    + (i.channel ? `<span class="c" title="${i.channel === 'stable' ? 'In the official release' : 'On the latest version, not yet released'}">${esc(i.channel)}</span>` : '')
    + (i.issue ? `<a href="${REPO}/issues/${i.issue}">Issue #${i.issue}</a>` : '')
    + `<a href="${esc(i.url)}">Discuss</a></div><div class="b">${clean(i.html)}</div></article>`;
}
// the filter: one button per script that has posts, kept in the address as ?script=<name>
function filter(items) {
  const bar = document.getElementById('bar'), names = [...new Set(items.map(i => i.script))].sort();
  const pick = new URLSearchParams(location.search).get('script') || '', many = names.length > 1;
  // the gallery button: every image of the posts shown, so a script filter narrows it too
  const gal = document.querySelector('#list .b img:not(.emoji)') ? '<button type="button" class="gal" title="Every image in the posts shown, full screen">All images</button>' : '';
  if (!many && !gal) return;
  bar.innerHTML = (many ? `<button type="button" data-s="" aria-pressed="${!pick}">All</button>`
    + names.map(n => `<button type="button" data-s="${esc(n)}" aria-pressed="${n === pick}">${icon(items.find(i => i.script === n))}${esc(n)}</button>`).join('') : '') + gal;
  bar.hidden = false;
  const show = s => {
    bar.querySelectorAll('button[data-s]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === s));
    document.querySelectorAll('article').forEach(a => { a.hidden = !!s && a.dataset.script !== s; });
    tocSync();
    const u = new URL(location.href); if (s) u.searchParams.set('script', s); else u.searchParams.delete('script');
    history.replaceState(null, '', u);
  };
  bar.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('gal')) { const all = shots(document.querySelectorAll('#list article:not([hidden]) .b')); if (all.length) lbOpen(all, 0, true); }
    else show(b.dataset.s);
  };
  if (pick) show(pick);
}
// the contents: one line a post, its icon, title and date; it follows the filter and marks the post being read
const toc = document.getElementById('toc'), wide = matchMedia('(min-width:1260px)');
function tocBuild(items) {
  if (items.length < 2) return;
  toc.querySelector('ol').innerHTML = items.map(i => `<li data-id="${i.id}"><a href="#${i.id}" title="${esc(i.script)}">${icon(i)}<span>${esc(i.title)}</span>`
    + `<time datetime="${esc(i.at)}">${esc(new Date(i.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }))}</time></a></li>`).join('');
  toc.hidden = false;
  const fit = () => { toc.open = wide.matches; };
  fit(); wide.addEventListener('change', fit);
  toc.querySelector('summary').onclick = e => { if (wide.matches) e.preventDefault(); };
  toc.querySelector('ol').onclick = e => {
    const a = e.target.closest('a'); if (!a || e.button || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    const art = document.getElementById(a.getAttribute('href').slice(1)); if (!art) return;
    history.replaceState(null, '', location.pathname + location.search + '#' + art.id);
    if (!wide.matches) toc.open = false;
    art.scrollIntoView();
  };
  let busy = false;
  addEventListener('scroll', () => { if (!busy) { busy = true; requestAnimationFrame(() => { busy = false; tocMark(); }); } }, { passive: true });
  tocSync();
}
function tocSync() {
  if (toc.hidden) return;
  let n = 0;
  toc.querySelectorAll('li').forEach(li => { const art = document.getElementById(li.dataset.id); li.hidden = !art || art.hidden; if (!li.hidden) n++; });
  toc.querySelector('summary').textContent = 'Contents (' + n + ')';
  tocMark();
}
// the post being read is the last one whose top is above the upper third of the window
function tocMark() {
  let cur = null;
  for (const a of document.querySelectorAll('#list article:not([hidden])')) { if (a.getBoundingClientRect().top <= innerHeight / 3) cur = a; else break; }
  if (!cur) cur = document.querySelector('#list article:not([hidden])');
  toc.querySelectorAll('a.on').forEach(a => { if (!cur || a.getAttribute('href') !== '#' + cur.id) a.classList.remove('on'); });
  const on = cur && toc.querySelector(`a[href="#${cur.id}"]`);
  if (!on || on.classList.contains('on')) return;
  on.classList.add('on');
  if (wide.matches) {   // keep the marked line inside the panel when the list is longer than the window
    const r = on.getBoundingClientRect(), p = toc.getBoundingClientRect();
    if (r.top < p.top + 30 || r.bottom > p.bottom - 10) toc.scrollTop += r.top - p.top - p.height / 3;
  }
}
// a click on a post's image opens the full view, as Art Station's: the post's images in order; ←/→ or a swipe move,
// the wheel or ↑/↓ zoom, a drag pans, Esc or a swipe down or a click beside the image closes
const lb = { el: null, imgs: [], i: 0, all: false, z: { s: 1, x: 0, y: 0 } };
// the images of the given post bodies, each with its post
const shots = bodies => [...bodies].flatMap(b => [...b.querySelectorAll('img:not(.emoji)')].map(x => {
  const art = b.closest('article'), a = art && art.querySelector('h2 a');
  return { src: x.currentSrc || x.src, el: x, id: art ? art.id : '', title: a ? a.textContent : '' };
}));
function lbZoom() { const m = lb.el.querySelector('img'); m.style.transform = `translate(${lb.z.x}px,${lb.z.y}px) scale(${lb.z.s})`; m.classList.toggle('z', lb.z.s > 1); }
function lbScale(f, cx, cy) {
  const m = lb.el.querySelector('img'), r = m.getBoundingClientRect(), s = Math.min(8, Math.max(1, lb.z.s * f));
  if (s === lb.z.s) return;
  const ox = r.left + r.width / 2 - lb.z.x, oy = r.top + r.height / 2 - lb.z.y, rx = (cx ?? ox) - ox, ry = (cy ?? oy) - oy;
  lb.z.x = rx - s * (rx - lb.z.x) / lb.z.s; lb.z.y = ry - s * (ry - lb.z.y) / lb.z.s; lb.z.s = s;
  if (s === 1) lb.z.x = lb.z.y = 0;
  lbZoom();
}
function lbShow(i) {
  lb.i = (i + lb.imgs.length) % lb.imgs.length;
  const it = lb.imgs[lb.i], src = it.src, m = lb.el.querySelector('img'), n = lb.imgs.length;
  // moving on, the image shown dims until the next one is in (a big image takes seconds); a fresh open just draws it
  const done = () => m.classList.remove('loading');
  m.onload = m.onerror = done; m.classList.toggle('loading', !!m.getAttribute('src')); m.src = src; if (m.complete) done();
  lb.el.querySelectorAll('.nav').forEach(b => { b.hidden = n < 2; });
  lb.el.querySelector('.cap').innerHTML = (n > 1 ? `<span>${lb.i + 1} / ${n}</span>` : '')
    + (lb.all && it.id ? `<a href="#${esc(it.id)}" class="go" title="Close and go to this post">${esc(it.title)}</a>` : '')
    + `<a href="${esc(src)}" target="_blank" rel="noopener">Open original</a>`;
}
function lbClose() { lb.el.hidden = true; document.body.classList.remove('lb'); lb.el.querySelector('img').removeAttribute('src'); }
function lbOpen(imgs, i, all) {
  if (!lb.el) {
    const el = lb.el = document.createElement('div'); el.id = 'lb'; el.hidden = true;
    el.innerHTML = '<button class="x" type="button" title="Close (Esc)">✕</button><button class="nav prev" type="button" title="Previous (←)">‹</button>'
      + '<img alt=""><button class="nav next" type="button" title="Next (→)">›</button><div class="cap"></div>';
    document.body.append(el);
    el.querySelector('.x').onclick = lbClose;
    // in the all-images gallery, the post's title closes it and goes to the post
    el.querySelector('.cap').addEventListener('click', e => {
      const a = e.target.closest('a.go'); if (!a) return;
      e.preventDefault(); lbClose();
      const art = document.getElementById(a.getAttribute('href').slice(1));
      if (art) { history.replaceState(null, '', location.pathname + location.search + '#' + art.id); art.scrollIntoView(); }
    });
    el.querySelector('.prev').onclick = () => lbShow(lb.i - 1);
    el.querySelector('.next').onclick = () => lbShow(lb.i + 1);
    let down = null;   // a click on the backdrop closes, a drag that ends there does not
    el.addEventListener('mousedown', e => { down = e.target === el ? [e.clientX, e.clientY] : null; });
    el.addEventListener('click', e => { if (e.target === el && down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 6) lbClose(); });
    el.addEventListener('wheel', e => { e.preventDefault(); lbScale(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX, e.clientY); }, { passive: false });
    const m = el.querySelector('img');
    m.addEventListener('mousedown', e => {
      if (lb.z.s <= 1) return; e.preventDefault();
      const sx = e.clientX, sy = e.clientY, ox = lb.z.x, oy = lb.z.y;
      const mv = ev => { lb.z.x = ox + ev.clientX - sx; lb.z.y = oy + ev.clientY - sy; lbZoom(); };
      const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
      addEventListener('mousemove', mv); addEventListener('mouseup', up);
    });
    m.addEventListener('dblclick', () => { lb.z = { s: 1, x: 0, y: 0 }; lbZoom(); });
    // touch: a swipe left or right moves, a swipe down closes; pinching is the browser's own zoom
    let t0 = null;
    el.addEventListener('touchstart', e => { t0 = e.touches.length === 1 ? [e.touches[0].clientX, e.touches[0].clientY] : null; }, { passive: true });
    el.addEventListener('touchend', e => {
      if (!t0 || e.touches.length) return;
      const dx = e.changedTouches[0].clientX - t0[0], dy = e.changedTouches[0].clientY - t0[1]; t0 = null;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3 && lb.imgs.length > 1) lbShow(lb.i + (dx < 0 ? 1 : -1));
      else if (dy > 80 && dy > Math.abs(dx) * 1.3) lbClose();
    }, { passive: true });
    addEventListener('keydown', e => {
      if (lb.el.hidden) return;
      const k = { Escape: lbClose, ArrowLeft: () => lbShow(lb.i - 1), ArrowRight: () => lbShow(lb.i + 1), ArrowUp: () => lbScale(1.2), ArrowDown: () => lbScale(1 / 1.2) }[e.key];
      if (k) { e.preventDefault(); k(); }
    });
  }
  lb.imgs = imgs; lb.all = !!all; lb.z = { s: 1, x: 0, y: 0 }; lbZoom();
  lb.el.hidden = false; document.body.classList.add('lb');
  lbShow(i);
}
// GitHub wraps each uploaded image in a link to the file itself: that link opens the full view instead
document.addEventListener('click', e => {
  const img = e.target.closest('.b img:not(.emoji)'); if (!img || e.button || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const a = img.closest('a');
  if (a && a.href !== img.src && !/user-attachments|githubusercontent/.test(a.href)) return;   // an image that links elsewhere keeps its link
  e.preventDefault();
  const all = shots([img.closest('.b')]);
  lbOpen(all, all.findIndex(x => x.el === img));
});

// news/<id>.html is this page with data-post="<id>" (dev/news/build.mjs writes it): it shows that post alone
const one = document.documentElement.dataset.post;
fetch('./news.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => {
  const list = document.getElementById('list');
  if (one) {
    const i = (j.items || []).find(x => String(x.id) === one);
    document.getElementById('lede').innerHTML = `<a href="./news.html#${esc(one)}">All announcements</a>`;
    list.innerHTML = i ? post(i) : '<p class="state">This announcement was removed.</p>';
    return;
  }
  const items = j.items || [];
  list.innerHTML = items.length ? items.map(post).join('') : '<p class="state">No announcements yet.</p>';
  if (j.generated) { const d = day(j.generated); document.getElementById('lede').textContent += ' Updated ' + d + (/.$/.test(d) ? '' : '.'); }
  tocBuild(items);
  filter(items);
  list.onclick = e => {
    const a = e.target.closest('h2 a[data-id]');
    if (!a || e.button || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    history.replaceState(null, '', location.pathname + location.search + '#' + a.dataset.id);
    a.closest('article').scrollIntoView();
  };
  // a link to one post (news.html#1122) lands on it once the posts are drawn
  if (location.hash) { const a = document.getElementById(location.hash.slice(1)); if (a) { a.hidden = false; a.scrollIntoView(); } }
}).catch(() => {
  document.getElementById('list').innerHTML = `<p class="state">The announcements could not be loaded. Read them <a href="${REPO}/discussions/categories/announcements">on GitHub</a>.</p>`;
});
</script>
</body>
</html>
