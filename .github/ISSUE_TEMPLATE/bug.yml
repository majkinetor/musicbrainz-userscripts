name: Bug report
description: Something in a script is broken. Suggestions go to Discussions instead.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Issues are for bugs. For suggestions or feature requests, [open a discussion](https://github.com/majkinetor/musicbrainz-userscripts/discussions/new?category=ideas).
  - type: textarea
    id: script
    attributes:
      label: Script versions
      description: Open Event Horizon (the command palette), run "String Theory: Copy versions as Markdown", and paste the result here. It lists your installed script versions.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (a page link helps)
