<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Horizon homepage on a phone: top section</title>
<style>
body{margin:0;padding:20px;background:#121215;color:#ddd;font:14px/1.45 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}p.lead{margin:0 0 18px;color:#999;max-width:1100px}
.row{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
figure{margin:0;width:248px}
figure img{display:block;width:248px;height:auto;border-radius:14px;border:1px solid #333}
figcaption{margin-top:8px;font-size:12.5px;color:#aaa}
figcaption b{display:block;color:#eee;font-size:14px;margin-bottom:2px}
.rec b::after{content:" (recommended)";color:#f07dbf;font-weight:600}
</style></head><body>
<h1>Homepage top on a phone (248 px, how 145% font size lays out)</h1>
<p class="lead">Real Event Horizon page at your phone's width, dark, with each option's CSS applied. Common to A, B and C: the red Search button is gone (Enter, or the keyboard's Go, submits), and the gap under the icons is smaller.</p>
<div class="row">
<figure><img src="current.png" alt=""><figcaption><b>Now</b>Box on two lines with a big Search button; ADD icons 40 px on three rows.</figcaption></figure>
<figure class="rec"><img src="A.png" alt=""><figcaption><b>A · one line, swipe</b>Search is one rounded line: lens, “Search”, a small type chip, filter. ADD is one row of 34 px icons; swipe left/right for the rest, the right edge fades to show there's more.</figcaption></figure>
<figure><img src="B.png" alt=""><figcaption><b>B · all icons fit</b>Search keeps the full placeholder, type and filter on a small second line. All 9 ADD icons fit in one row, smaller (24 px), no label, no swipe.</figcaption></figure>
<figure><img src="C.png" alt=""><figcaption><b>C · + menu, closed</b>Search on one line plus a round + button; no ADD row at all. Most minimal, but the input gets narrow (“Sear…”).</figcaption></figure>
<figure><img src="Copen.png" alt=""><figcaption><b>C · + menu, open</b>Tapping + opens the ADD icons as a small panel.</figcaption></figure>
</div>
</body></html>
