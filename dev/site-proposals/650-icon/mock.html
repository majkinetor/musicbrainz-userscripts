<!doctype html>
<html><head><meta charset="utf-8"><title>First Contact icon on dark</title>
<style>
body{margin:0;padding:22px;background:#f6f5fa;font:13px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#222}
h3{margin:0 0 4px;font-size:14px;color:#3b2c70}
.note{margin:0 0 14px;color:#555;max-width:900px}
.grid{display:grid;grid-template-columns:200px repeat(2,1fr);gap:14px 18px;align-items:center;max-width:1000px}
.lbl b{display:block;color:#3b2c70}.lbl span{color:#666;font-size:12px}
.cell{display:flex;align-items:center;gap:18px;padding:14px 16px;border-radius:12px}
.dark{background:#000}.light{background:#fff;border:1px solid #e2dcef}
.btn{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;font:500 17px/1 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
.dark .btn{background:#1e1b24;color:#e9e5f2;border:1px solid #3b3548}
.light .btn{background:#faf9fe;color:#3b2c70;border:1px solid #cfc6e6}
.btn svg{width:22px;height:22px}
.big svg{width:72px;height:72px}
.head{font-weight:bold;color:#3b2c70}
</style></head><body>
<h3>First Contact icon: the saucer on a dark background</h3>
<p class="note">The saucer and landing ring are dark navy (#1e2346), so on a dark button only the beam and the release show. Three ways to fix it, each at button size and enlarged, on dark and light.</p>
<div class="grid" id="g">
  <div></div><div class="head">dark</div><div class="head">light</div>
</div>
<script>
const parts = (hull, rim, ring, lights) => `
  <path d="M50 44 L78 44 L104 112 L24 112 Z" fill="#f6c431"/>
  <ellipse cx="64" cy="114" rx="42" ry="8" fill="${ring}"${rim ? ` stroke="${rim}" stroke-width="3"` : ''}/>
  <path d="M40 26 A24 18 0 0 1 88 26 Z" fill="${hull.dome}"${rim ? ` stroke="${rim}" stroke-width="3"` : ''}/>
  <ellipse cx="64" cy="32" rx="56" ry="13" fill="${hull.disc}"${rim ? ` stroke="${rim}" stroke-width="3"` : ''}/>
  <circle cx="38" cy="32" r="4.4" fill="${lights}"/><circle cx="64" cy="34" r="4.4" fill="${lights}"/><circle cx="90" cy="32" r="4.4" fill="${lights}"/>
  <path d="M64 58 L84 69.5 L84 92.5 L64 104 L44 92.5 L44 69.5 Z" fill="#7b4fd6"/>
  <path d="M60 72 L74 69 L74 89 M60 72 L60 92" fill="none" stroke="#fff" stroke-width="3.4"/>
  <ellipse cx="56" cy="92" rx="4.6" ry="3.6" fill="#fff"/><ellipse cx="70" cy="89" rx="4.6" ry="3.6" fill="#fff"/>`;
const svg = inner => `<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const NAVY = { dome: '#1e2346', disc: '#1e2346' };
const variants = [
  { k: 'Now', d: 'navy saucer', dark: svg(parts(NAVY, null, '#1e2346', '#fff')), light: svg(parts(NAVY, null, '#1e2346', '#fff')) },
  { k: 'A · light rim', d: 'the same navy saucer with a pale rim; one icon for both themes', dark: svg(parts(NAVY, '#c9cdf2', '#1e2346', '#fff')), light: svg(parts(NAVY, '#c9cdf2', '#1e2346', '#fff')) },
  { k: 'B · silver saucer (recommended)', d: 'a metallic grey-blue hull with dark windows; reads on both, one icon', dark: svg(parts({ dome: '#b9c0e8', disc: '#8f98cf' }, null, '#8f98cf', '#1e2346')), light: svg(parts({ dome: '#b9c0e8', disc: '#8f98cf' }, '#3b4270', '#8f98cf', '#1e2346')) },
  { k: 'C · follows the theme', d: 'navy on light, silver on dark: the button’s text colour drives the hull (currentColor)', dark: svg(parts({ dome: '#d6d2e6', disc: '#bdb8d3' }, null, '#bdb8d3', '#1e1b24')), light: svg(parts(NAVY, null, '#1e2346', '#fff')) },
];
const g = document.getElementById('g');
for (const v of variants) {
  g.insertAdjacentHTML('beforeend', `<div class="lbl"><b>${v.k}</b><span>${v.d}</span></div>`
    + ['dark', 'light'].map(t => `<div class="cell ${t}"><span class="btn">${v[t]}Import to MusicBrainz</span><span class="big">${v[t]}</span></div>`).join(''));
}
</script>
</body></html>
